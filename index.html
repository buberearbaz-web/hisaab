* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, .tnum { font-variant-numeric: tabular-nums; }

.app { max-width: 1160px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 120px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mark { width: 38px; height: 38px; border-radius: 10px; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 20px/1 var(--f-display); flex: none; }
.wordmark { font: 800 23px/1 var(--f-display); font-stretch: 122%; letter-spacing: -0.01em; }
.tagline { font: 500 10.5px/1.2 var(--f-mono); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; overflow-wrap: anywhere; }
.month-switch { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; }
.month-switch button { border: 0; background: transparent; height: 34px; min-width: 34px; border-radius: 999px; font-weight: 600; font-size: 14px; }
.month-switch button:hover { background: var(--surface-2); }
.month-switch .mlabel { padding-inline: 12px; min-width: 148px; }
.month-switch .arrow { font-size: 18px; line-height: 1; color: var(--ink-2); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-block: 4px 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; border: 0; background: none; padding: 10px 12px; font: 600 14px/1.2 var(--f-body); color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 480px) { .tab { padding-inline: 9px; font-size: 13.5px; } }

.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-weight: 500; margin-bottom: 16px; }

/* Shared pieces */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 14px; padding: 18px; min-width: 0; }
@media (max-width: 480px) { .card { padding: 14px; border-radius: 12px; } }
.card-head { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
.card-head h2 { font: 700 17px/1.25 var(--f-display); font-stretch: 108%; margin: 0; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 13px; }
.eyebrow { font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grow { flex: 1; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--f-body); padding: 4px 8px; border-radius: 999px; white-space: nowrap; }

.pill.good { color: var(--good); background: var(--good-soft); }
.pill.warn { color: var(--warn); background: var(--warn-soft); }
.pill.bad { color: var(--bad); background: var(--bad-soft); }
.pill.neutral { color: var(--muted); background: var(--surface-2); }
.tag { font: 500 10px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 2px 4px; vertical-align: 1px; }
.pos { color: var(--muted); }
.neg { color: var(--bad); }
.credit { color: var(--good); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--surface); padding: 9px 14px; font-weight: 600; font-size: 14px; line-height: 1.1; text-decoration: none; color: var(--ink); }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 45%, transparent); background: transparent; }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.icon-btn { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; line-height: 1; color: var(--muted); flex: none; }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: inherit; text-decoration: underline; text-underline-offset: 2px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font: 700 17px/1.3 var(--f-display); margin-bottom: 6px; }
.empty .btn { margin-top: 14px; }

/* Onboarding */
.ob-wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 14px 64px; }
@media (min-width: 720px) { .ob-wrap { padding-inline: 24px; } }

.ob-pitch h1 { font: 800 clamp(30px, 5.2vw, 48px)/1.04 var(--f-display); font-stretch: 116%; letter-spacing: -0.02em; margin: 8px 0 12px; text-wrap: balance; max-width: 17ch; }
.lede { color: var(--ink-2); font-size: 16px; margin: 0; max-width: 56ch; }
.sbar { display: flex; gap: 3px; height: 14px; margin-block: 22px 14px; }
.sbar span { height: 100%; }
.sbar span:first-child { border-radius: 4px 0 0 4px; }
.sbar span:last-child { border-radius: 0 4px 4px 0; }
.tiles { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 14px; overflow: hidden; }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tiles li { background: var(--surface); padding: 14px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.t-pct { font: 800 34px/1 var(--f-display); font-stretch: 112%; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 2px; }
.t-pct small { font-size: 16px; color: var(--muted); font-weight: 700; }
.t-name { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; margin-top: 8px; }
.t-amt { font: 500 12.5px/1.3 var(--f-mono); color: var(--ink-2); }
.t-hint { font-size: 12.5px; color: var(--muted); }
.ex-note { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.values { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; font-size: 14px; color: var(--ink-2); }
.values li { display: flex; gap: 10px; align-items: baseline; }
.values li::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--accent); flex: none; transform: translateY(-1px); }
.ob-card { padding: 22px; }
@media (max-width: 480px) { .ob-card { padding: 16px; } }
.ob-narrow { max-width: 660px; margin-inline: auto; width: 100%; }
.ob-step { font: 500 11px/1.3 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
.ob-card h2 { font: 700 22px/1.2 var(--f-display); font-stretch: 110%; margin: 6px 0 4px; text-wrap: balance; }
.ob-card > .sub { font-size: 14px; max-width: 58ch; }
.form { display: grid; gap: 14px; margin-top: 18px; }
.opt { color: var(--muted); font-weight: 400; }
.privacy { font-size: 12.5px; color: var(--muted); margin: 0; }
.ob-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.ob-actions .btn { padding: 11px 18px; font-size: 15px; }
.ob-income { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-top: 18px; }
.ob-income .amt { flex: 1 1 220px; }
.ob-income .field { flex: 0 1 200px; }
.fmt { margin-top: 20px; }
.fmt-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 520px) { .fmt-opts { grid-template-columns: minmax(0, 1fr); } }
.fmt-opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--rule-strong); border-radius: 12px; padding: 12px; cursor: pointer; background: var(--surface); min-width: 0; }
.fmt-opt input { width: 16px; height: 16px; margin: 3px 0 0; flex: none; accent-color: var(--accent); }
.fmt-opt b { display: block; font-size: 14.5px; font-weight: 700; }
.fmt-opt small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.fmt-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.fmt-opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.ob-split { margin-top: 20px; border-top: 1px solid var(--rule); }
.ob-row { display: grid; grid-template-columns: auto minmax(0, 1fr) 84px minmax(88px, auto); gap: 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--rule); }
.ob-row .nm b { display: block; font-weight: 600; font-size: 14.5px; }
.ob-row .nm small { display: block; color: var(--muted); font-size: 12.5px; }
.pct-in { display: flex; align-items: center; gap: 4px; color: var(--muted); }
.pct-in input { width: 58px; text-align: right; border: 1px solid var(--rule-strong); background: var(--surface); border-radius: 8px; padding: 7px 8px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pct-in input[aria-invalid="true"] { border-color: var(--bad); background: var(--bad-soft); }
.ob-amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
@media (max-width: 480px) {
  .ob-row { grid-template-columns: auto minmax(0, 1fr) 76px; row-gap: 2px; }
  .ob-amt { grid-column: 2 / -1; text-align: left; font-size: 13px; color: var(--ink-2); font-weight: 500; }
}
.ob-total { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-block: 12px 18px; font-size: 13.5px; }
.goalbox { border: 1px solid var(--rule); border-radius: 12px; padding: 14px; display: grid; gap: 12px; background: var(--surface-2); margin-top: 16px; }
.goalbox h3 { margin: 0; font: 700 15px/1.2 var(--f-display); font-stretch: 105%; display: flex; gap: 8px; align-items: center; }

@media (max-width: 480px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.suggest { font-size: 12.5px; color: var(--muted); margin: 0; }

/* Overview */
.notice { display: flex; align-items: center; gap: 10px 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 14px; }
.notice p { margin: 0; flex: 1 1 280px; color: var(--ink-2); }
.ov { display: flex; flex-direction: column; gap: 16px; }
.ov > .col { display: contents; }
.hero { order: 1; } .fixed { order: 2; } .buckets { order: 3; } .daily { order: 4; } .goal { order: 5; } .zakat { order: 6; }
@media (min-width: 920px) {
  .ov { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; gap: 18px; }
  .ov > .col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
}

.hero { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 20px; }
.hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-radial-gradient(circle at 104% -12%, transparent 0 12px, var(--guilloche) 12px 13px);
  -webkit-mask-image: radial-gradient(circle at 100% 0, #000 0 30%, transparent 68%);
  mask-image: radial-gradient(circle at 100% 0, #000 0 30%, transparent 68%); }
.hero > * { position: relative; }
.hero-num { font: 800 clamp(40px, 10vw, 62px)/1 var(--f-display); font-stretch: 112%; letter-spacing: -0.025em; margin-top: 8px; overflow-wrap: anywhere; }
.hero-num.over { color: var(--bad); }
.hero-sub { margin: 8px 0 0; color: var(--ink-2); max-width: 60ch; }
.hero-note { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.split { display: flex; gap: 2px; height: 12px; margin-block: 20px 16px; }
.split > span { height: 100%; min-width: 0; }
.split > span:first-child { border-radius: 4px 0 0 4px; }
.split > span:last-child { border-radius: 0 4px 4px 0; }
.split > span:only-child { border-radius: 4px; }
.k-spent { background: var(--ink-2); }
.k-saved { background: var(--accent); }
.k-due { background: repeating-linear-gradient(135deg, var(--rule-strong) 0 3px, transparent 3px 6px); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.k-free { background: var(--accent-soft); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 55%, transparent); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
@media (max-width: 600px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats > div { min-width: 0; }
.stats dt { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.stats dt .key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.stats dd { margin: 2px 0 0; font: 700 18px/1.2 var(--f-display); font-stretch: 105%; }
.stats dd small { display: block; font: 400 12px/1.3 var(--f-body); color: var(--muted); margin-top: 2px; }

.bucket { padding-block: 14px; border-top: 1px solid var(--rule); }
.bucket:first-of-type { border-top: 0; padding-top: 0; }
.b-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.b-top h3 { margin: 0; font: 700 15px/1.2 var(--f-display); font-stretch: 105%; }
.b-pct { font: 500 12px/1 var(--f-mono); color: var(--muted); }
.b-amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.b-amt .of { color: var(--muted); font-weight: 400; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--rule); margin-top: 10px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--c); }
.b-note { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }
.items { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
.items li { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(92px, auto); align-items: baseline; column-gap: 12px; row-gap: 4px; font-size: 13.5px; }
.i-name { min-width: 0; overflow-wrap: anywhere; }

.kbd.blue { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

<script>
(() => {
  "use strict";

  // ---------- your links ----------
  // Paste your links here once Hisaab is published. Empty ones stay hidden.
  const LINKS = {
    github: "https://github.com/buberearbaz-web/hisaab",
    pinterest: "https://www.pinterest.com/buberearbaz/",
  };

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayISO = () => isoOf(new Date());
  const thisYm = () => todayISO().slice(0, 7);
  const ymParts = (ym) => ym.split("-").map(Number);
  const daysIn = (ym) => { const [y, m] = ymParts(ym); return new Date(y, m, 0).getDate(); };
  const shiftYm = (ym, k) => { const [y, m] = ymParts(ym); const d = new Date(y, m - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
  const monthsBetween = (a, b) => { const [ya, ma] = ymParts(a); const [yb, mb] = ymParts(b); return (yb - ya) * 12 + (mb - ma); };
  const ymDate = (ym) => { const [y, m] = ymParts(ym); return new Date(y, m - 1, 1); };
  const monthLong = (ym) => ymDate(ym).toLocaleDateString("en-IN", { month: "long", year: "numeric" });
  const monthOnly = (ym) => ymDate(ym).toLocaleDateString("en-IN", { month: "long" });
  const monthShort = (ym) => ymDate(ym).toLocaleDateString("en-IN", { month: "short" });
  const parseISO = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
  const newId = (p = "e") => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const firstName = (n) => String(n || "").trim().split(/\s+/)[0] || "";

  const CURRENCIES = [
    { code: "INR", sym: "₹", loc: "en-IN", lakh: true, name: "Indian rupee" },
    { code: "PKR", sym: "Rs ", loc: "en-IN", lakh: true, name: "Pakistani rupee" },
    { code: "BDT", sym: "৳", loc: "en-IN", lakh: true, name: "Bangladeshi taka" },
    { code: "AED", sym: "AED ", loc: "en-US", name: "UAE dirham" },
    { code: "SAR", sym: "SAR ", loc: "en-US", name: "Saudi riyal" },
    { code: "QAR", sym: "QAR ", loc: "en-US", name: "Qatari riyal" },
    { code: "KWD", sym: "KWD ", loc: "en-US", name: "Kuwaiti dinar" },
    { code: "OMR", sym: "OMR ", loc: "en-US", name: "Omani rial" },
    { code: "BHD", sym: "BHD ", loc: "en-US", name: "Bahraini dinar" },
    { code: "USD", sym: "$", loc: "en-US", name: "US dollar" },
    { code: "GBP", sym: "£", loc: "en-GB", name: "British pound" },
    { code: "EUR", sym: "€", loc: "en-IE", name: "Euro" },
  ];
  let CUR, nf, nf0;
  function setCurrency(code) {
    CUR = CURRENCIES.find((c) => c.code === code) || CURRENCIES[0];
    nf = new Intl.NumberFormat(CUR.loc, { maximumFractionDigits: 2 });
    nf0 = new Intl.NumberFormat(CUR.loc, { maximumFractionDigits: 0 });
    const s = $("#fCurSym"); if (s) s.textContent = CUR.sym.trim();
  }
  setCurrency("INR");
  // A first guess from the time zone; people can change it during setup and in Plan.
  function guessCurrency() {
    let tz = "";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (e) {}
    const byZone = { "Asia/Kolkata": "INR", "Asia/Calcutta": "INR", "Asia/Karachi": "PKR", "Asia/Dhaka": "BDT", "Asia/Dubai": "AED", "Asia/Riyadh": "SAR", "Asia/Qatar": "QAR", "Asia/Kuwait": "KWD", "Asia/Muscat": "OMR", "Asia/Bahrain": "BHD", "Europe/London": "GBP" };
    if (byZone[tz]) return byZone[tz];
    if (tz.startsWith("America/")) return "USD";
    if (tz.startsWith("Europe/")) return "EUR";
    return "INR";
  }
  const EXAMPLE_PAY = { INR: 50000, PKR: 150000, BDT: 60000, AED: 15000, SAR: 15000, QAR: 15000, KWD: 1200, OMR: 1500, BHD: 1500, USD: 5000, GBP: 3500, EUR: 4000 };
  const UNIT = { INR: "rupee", PKR: "rupee", BDT: "taka", AED: "dirham", SAR: "riyal", QAR: "riyal", KWD: "dinar", OMR: "rial", BHD: "dinar", USD: "dollar", GBP: "pound", EUR: "euro" };
  const rs = (n) => (n < 0 ? "−" : "") + CUR.sym + nf.format(Math.abs(Math.round(n * 100) / 100));
  const rs0 = (n) => (n < 0 ? "−" : "") + CUR.sym + nf0.format(Math.abs(Math.round(n)));
  const trim1 = (x) => String(+x.toFixed(1));
  const compact = (n) => {
    const a = Math.abs(n), sg = n < 0 ? "−" : "";
    if (CUR.lakh) {
      if (a >= 1e7) return sg + CUR.sym + trim1(a / 1e7) + "Cr";
      if (a >= 1e5) return sg + CUR.sym + trim1(a / 1e5) + "L";
    } else if (a >= 1e6) return sg + CUR.sym + trim1(a / 1e6) + "M";
    if (a >= 1e3) return sg + CUR.sym + trim1(a / 1e3) + "K";
    return sg + CUR.sym + Math.round(a);
  };

  // Arithmetic like 349+349+530 — parsed, never eval'd.
  function evalExpr(str) {
    const s = String(str ?? "").replace(/[,\s₹$£€৳]/g, "").replace(/^(inr|rs|pkr|bdt|aed|sar|qar|kwd|omr|bhd|usd|gbp|eur)/i, "");
    if (!s || !/^[0-9+\-*/().]+$/.test(s)) return NaN;
    let i = 0;
    const num = () => { const st = i; while (i < s.length && /[0-9.]/.test(s[i])) i++; if (st === i) throw 0; const v = parseFloat(s.slice(st, i)); if (Number.isNaN(v)) throw 0; return v; };
    const factor = () => {
      if (s[i] === "(") { i++; const v = expr(); if (s[i] !== ")") throw 0; i++; return v; }
      if (s[i] === "-") { i++; return -factor(); }
      if (s[i] === "+") { i++; return factor(); }
      return num();
    };
    const term = () => { let v = factor(); while (s[i] === "*" || s[i] === "/") { const op = s[i++]; const r = factor(); v = op === "*" ? v * r : v / r; } return v; };
    const expr = () => { let v = term(); while (s[i] === "+" || s[i] === "-") { const op = s[i++]; const r = term(); v = op === "+" ? v + r : v - r; } return v; };
    try { const v = expr(); if (i !== s.length || !Number.isFinite(v)) return NaN; return Math.round(v * 100) / 100; } catch (e) { return NaN; }
  }
  const hasOp = (s) => /[+*/]|\d\s*-/.test(String(s ?? ""));
  const numOr = (v, d = 0) => { const n = evalExpr(v); return Number.isNaN(n) ? d : n; };


  // No interest (riba) category on purpose.
  const INCOME_CATS = [
    { id: "salary", name: "Salary" },
    { id: "business", name: "Business" },
    { id: "freelance", name: "Freelance" },
    { id: "bonus", name: "Bonus" },
    { id: "rent", name: "Rent received" },
    { id: "gift", name: "Gift" },
    { id: "other-income", name: "Other income" },
  ];
  const incomeName = (id) => INCOME_CATS.find((c) => c.id === id)?.name;

  // Starting formats. Both use 40·30·5·5·10·10. Each item is [name, share of its bucket,
  // fixed monthly payment, never fills a saving goal].
  const LEDGER = [
    { id: "needs", name: "Needs", pct: 40, kind: "spend",
      items: [["Home Expense", 0.706, true], ["Uber", 0.176], ["Utilities", 0.118, true]] },
    { id: "invest", name: "Investments", pct: 30, kind: "save",
      items: [["Bhissi", 0.696, true], ["Allah's share", 0.304, true, true]] },
    { id: "self", name: "Self improvement", pct: 5, kind: "spend",
      items: [["Gym/nutrition", 1]] },
    { id: "health", name: "Health", pct: 5, kind: "spend",
      items: [["Medicines", 1]] },
    { id: "emergency", name: "Emergency fund", pct: 10, kind: "save",
      items: [["Saving", 1, true]] },
    { id: "family", name: "Wife/Family", pct: 10, kind: "spend",
      items: [["Pocket Money", 0.5, true], ["Swiggy/Blinkit", 0.2], ["Shopping", 0.2], ["Dineout", 0.1]] },
  ];
  const SPLIT = [
    { id: "needs", name: "Needs", pct: 40, kind: "spend", hint: "Rent, groceries, bills, transport",
      items: [["Rent or home EMI", 0.45, true], ["Groceries", 0.25], ["Electricity, gas & water", 0.1, true], ["Transport & fuel", 0.12], ["Phone & internet", 0.08, true]] },
    { id: "invest", name: "Investments", pct: 30, kind: "save", hint: "Halal funds, gold, business, property",
      items: [["Monthly SIP", 0.6, true], ["Gold", 0.2], ["Stocks & business", 0.2]] },
    { id: "self", name: "Self improvement", pct: 5, kind: "spend", hint: "Books, courses, Islamic learning",
      items: [["Books & courses", 0.6], ["Skills & certifications", 0.4]] },
    { id: "health", name: "Health", pct: 5, kind: "spend", hint: "Gym, doctor, insurance",
      items: [["Gym & sport", 0.4], ["Doctor & medicines", 0.3], ["Health insurance", 0.3, true]] },
    { id: "emergency", name: "Emergency fund", pct: 10, kind: "save", hint: "Six months of needs, kept liquid",
      items: [["Emergency savings", 1, true]] },
    { id: "family", name: "Family", pct: 10, kind: "spend", hint: "Parents, relatives, gifts, sadaqah",
      items: [["Parents", 0.6, true], ["Relatives & occasions", 0.25], ["Sadaqah", 0.15]] },
  ];
  const FORMATS = {
    ledger: { name: "Hisaab Ledger", desc: "The original Hisaab plan, line for line: Home Expense, Uber, Bhissi, Allah's share and more. 12 lines.", buckets: LEDGER },
    starter: { name: "Detailed starter", desc: "A fuller list: rent, groceries, bills, SIP, gold, insurance, parents and more. 17 lines.", buckets: SPLIT },
  };
  const fmtBuckets = () => (FORMATS[OB.format] || FORMATS.ledger).buckets;

  function roundNice(v) { const a = Math.abs(v); const step = a >= 20000 ? 100 : a >= 2000 ? 10 : 1; return Math.round(v / step) * step; }
  // Spread `alloc` over items by weight; the last item takes the remainder so the bucket matches exactly.
  function fillItems(items, alloc, weights) {
    let used = 0;
    items.forEach((it, k) => {
      if (k === items.length - 1) it.planned = Math.max(0, Math.round((alloc - used) * 100) / 100);
      else { it.planned = Math.max(0, roundNice(alloc * weights[k])); used += it.planned; }
      delete it.formula;
    });
  }

  // ---------- storage (this device only) ----------
  const KEY = "hisaab-v1";
  function storageWorks() { try { localStorage.setItem(KEY + ".t", "1"); localStorage.removeItem(KEY + ".t"); return true; } catch (e) { return false; } }
  function normalize(d) {
    if (!d || typeof d !== "object") return null;
    d.v = 1;
    d.entries = d.entries && typeof d.entries === "object" ? d.entries : {};
    // Only a first name is kept; backups from the WhatsApp version carry more.
    if (d.profile) d.profile = { name: String(d.profile.name || ""), joinedAt: d.profile.joinedAt || Date.now() };
    if (d.plan) {
      d.plan.buckets = Array.isArray(d.plan.buckets) ? d.plan.buckets : [];
      for (const b of d.plan.buckets) { b.items = Array.isArray(b.items) ? b.items : []; if (b.kind !== "save") b.kind = "spend"; }
      d.plan.goals = Array.isArray(d.plan.goals) ? d.plan.goals : [];
      d.plan.zakat = d.plan.zakat && typeof d.plan.zakat === "object" ? d.plan.zakat : { nisab: 0, other: 0 };
    }
    return d;
  }
  function load() { try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch (e) { return null; } }
  let warned = false;
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(S.data));
      if (!S.storageOk) { S.storageOk = true; renderChrome(); }
      return true;
    } catch (e) {
      S.storageOk = false;
      if (!warned) { warned = true; toast(e && e.name === "QuotaExceededError" ? "This device's storage is full. Save a backup from Settings." : "This browser isn't keeping your data. Save a backup from Settings."); }
      renderChrome();
      return false;
    }
  }

  // ---------- state ----------
  const TABS = ["overview", "passbook", "trends", "plan", "profile", "help"];
  const S = {
    data: null, storageOk: true, dl: null,
    idx: new Map(),
    ym: thisYm(),
    tab: "overview",
    filter: "all", q: "",
    draft: null, dirty: false,
    pendingRestore: null,
  };
  const OB = { step: 1, takeHome: null, currency: "INR", pcts: {}, efTarget: null, efOpening: 0, g2name: "", g2target: null, g2opening: 0 };
  function resetOb() {
    Object.assign(OB, { step: 1, format: "ledger", takeHome: null, currency: guessCurrency(), efTarget: null, efTouched: false, efOpening: 0, g2name: "", g2target: null, g2opening: 0 });
    OB.pcts = Object.fromEntries(fmtBuckets().map((d) => [d.id, d.pct]));
  }
  resetOb();
  try { const t = localStorage.getItem("hisaab.tab"); if (t) S.tab = t; } catch (e) {}
  const hashTab = (location.hash || "").slice(1);
  if (TABS.includes(hashTab)) S.tab = hashTab;
  if (!TABS.includes(S.tab)) S.tab = "overview";

  const setupDone = () => !!(S.data && S.data.setupDone && S.data.profile && S.data.plan && Array.isArray(S.data.plan.buckets));

  function reindex() {
    S.idx = new Map();
    for (const b of S.data?.plan?.buckets || []) for (const it of b.items || []) S.idx.set(it.id, { it, b });
  }
  const bucketColor = (b) => (b && Number.isInteger(b.slot) && b.slot >= 0 && b.slot < 6 ? `var(--s${b.slot + 1})` : "var(--s-other)");
  function bucketOf(e) {
    const ref = S.idx.get(e.item);
    if (ref) return ref.b;
    return (S.data?.plan?.buckets || []).find((b) => b.id === e.bucket) || null;
  }
  function labelOf(e) {
    if (e.type === "income") return incomeName(e.item) || e.label || "Income";
    if (e.item === "other") return e.label || "Other";
    return S.idx.get(e.item)?.it.name || e.label || "Expense";
  }
  const goalById = (id) => (S.data?.plan?.goals || []).find((g) => g.id === id) || null;
  function entriesOf(ym) {
    const d = S.data?.entries?.[ym];
    if (!d) return [];
    return Object.entries(d)
      .filter(([, e]) => e && typeof e.amount === "number" && typeof e.date === "string")
      .map(([id, e]) => ({ ...e, id }))
      .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0)));
  }
  const allMonths = () => Object.keys(S.data?.entries || {}).sort();

  function planTotals(P) {
    const t = { pct: 0, items: 0, save: 0, spend: 0, fixed: 0, variable: 0 };
    for (const b of P.buckets) {
      t.pct += +b.pct || 0;
      for (const it of b.items || []) {
        const v = +it.planned || 0;
        t.items += v;
        if (b.kind === "save") t.save += v; else t.spend += v;
        if (it.fixed) t.fixed += v;
        if (!it.fixed && b.kind !== "save") t.variable += v;
      }
    }
    return t;
  }

  function stats(ym) {
    const P = S.data.plan;
    const es = entriesOf(ym);
    const takeHome = +P.takeHome || 0;
    const byItem = {}, byBucket = {};
    let income = 0, spent = 0, saved = 0, salaryLogged = false;
    const daily = new Array(daysIn(ym)).fill(0);
    for (const e of es) {
      if (e.type === "income") { income += e.amount; if (e.item === "salary") salaryLogged = true; continue; }
      const ref = S.idx.get(e.item);
      const b = bucketOf(e);
      const bid = b ? b.id : "other";
      byItem[e.item] = (byItem[e.item] || 0) + e.amount;
      byBucket[bid] = (byBucket[bid] || 0) + e.amount;
      const isSave = b && b.kind === "save";
      if (isSave) saved += e.amount; else spent += e.amount;
      if (!(ref && ref.it.fixed) && !isSave) {
        const di = +e.date.slice(8, 10) - 1;
        if (di >= 0 && di < daily.length) daily[di] += e.amount;
      }
    }
    let dueFixed = 0;
    const fixed = [];
    for (const b of P.buckets) for (const it of b.items || []) if (it.fixed) {
      const got = byItem[it.id] || 0;
      const due = Math.max(0, (+it.planned || 0) - got);
      dueFixed += due;
      fixed.push({ it, b, got, due });
    }
    const basis = income + (salaryLogged ? 0 : takeHome);
    const free = basis - spent - saved - dueFixed;
    return { es, byItem, byBucket, income, spent, saved, salaryLogged, dueFixed, fixed, basis, free, daily, takeHome };
  }

  function goalSums() {
    const m = {};
    for (const ym of allMonths()) for (const e of entriesOf(ym)) if (e.type !== "income" && e.goal) m[e.goal] = (m[e.goal] || 0) + e.amount;
    return m;
  }
  function goalRate(g, P) {
    const b = P.buckets.find((x) => x.id === g.bucket);
    if (!b) return 0;
    const n = P.goals.filter((x) => x.bucket === b.id).length || 1;
    return ((+b.pct || 0) / 100) * (+P.takeHome || 0) / n;
  }
  function savedAllTime() {
    let s = 0;
    for (const ym of allMonths()) for (const e of entriesOf(ym)) {
      if (e.type === "income") continue;
      const b = bucketOf(e);
      if (b && b.kind === "save") s += e.amount;
    }
    return s;
  }

      else sub = `Planned for ${mName}, before anything is logged.`;
    } else {
      eyebrow = `Over budget · ${mName}`;
      sub = `Spending, savings and fixed payments come to ${rs0(-st.free)} more than this month's income.`;
    }
    const note = st.salaryLogged ? "" : `<p class="hero-note">Counts your planned take-home of ${rs0(st.takeHome)} until you log your salary.</p>`;
    const total = Math.max(st.basis, st.spent + st.saved + st.dueFixed) || 1;
    const segs = [
      ["k-spent", st.spent, "Spent"],
      ["k-saved", st.saved, "Saved & invested"],
      ["k-due", st.dueFixed, "Fixed still due"],
      ["k-free", Math.max(0, st.free), "Free to spend"],
    ].filter((s) => s[1] > 0);
    const splitHtml = segs.map(([k, v, l]) => `<span class="${k}" style="width:${(v / total) * 100}%" data-tip="${esc(l)}: ${rs0(v)}"></span>`).join("");
    const dueCount = st.fixed.filter((f) => f.due > 0).length;
    const hero = `
      <section class="hero" aria-label="Month summary">
        <div class="eyebrow">${esc(eyebrow)}</div>
        <div class="hero-num${st.free < 0 ? " over" : ""}">${rs0(st.free)}</div>
        <p class="hero-sub">${sub}</p>
        ${note}
        <div class="split" role="img" aria-label="${esc(segs.map((s) => `${s[2]} ${rs0(s[1])}`).join(", "))}">${splitHtml}</div>
        <dl class="stats">
          <div><dt><span class="key" style="background:var(--good)"></span>Income logged</dt><dd>${rs0(st.income)}<small>${st.salaryLogged ? "Salary received" : "Salary not logged yet"}</small></dd></div>
          <div><dt><span class="key k-spent"></span>Spent</dt><dd>${rs0(st.spent)}<small>of ${rs0(T.spend)} planned</small></dd></div>
          <div><dt><span class="key k-saved"></span>Saved &amp; invested</dt><dd>${rs0(st.saved)}<small>of ${rs0(T.save)} planned</small></dd></div>
          <div><dt><span class="key k-due"></span>Fixed still due</dt><dd>${rs0(st.dueFixed)}<small>${dueCount} payment${dueCount === 1 ? "" : "s"}</small></dd></div>
        </dl>
      </section>`;

    // buckets
    const bucketRows = P.buckets.map((b) => {
      const alloc = ((+b.pct || 0) / 100) * st.takeHome;
      const actual = st.byBucket[b.id] || 0;
      const planned = (b.items || []).reduce((a, it) => a + (+it.planned || 0), 0);
      const ratio = alloc > 0 ? actual / alloc : actual > 0 ? 2 : 0;
      let pill;
      if (b.kind === "save") pill = ratio >= 1 ? `<span class="pill good">Target met</span>` : `<span class="pill neutral">${rs0(alloc - actual)} to go</span>`;
      else pill = ratio > 1 ? `<span class="pill bad">Over by ${rs0(actual - alloc)}</span>` : ratio >= 0.9 ? `<span class="pill warn">Near limit</span>` : `<span class="pill good">On track</span>`;
      const pDiff = alloc - planned;
      const noteTxt = Math.abs(pDiff) < 1 ? "" : pDiff < 0
        ? `Planned items add up to ${rs0(planned)}, ${rs0(-pDiff)} more than this bucket's ${esc(b.pct)}%.`
        : `Planned items add up to ${rs0(planned)}, leaving ${rs0(pDiff)} of this bucket unassigned.`;
      const items = (b.items || []).map((it) => {
        const got = st.byItem[it.id] || 0;
        const pl = +it.planned || 0;
        const d = pl - got;
        const w = pl > 0 ? Math.min(100, (got / pl) * 100) : got > 0 ? 100 : 0;
        const tipTxt = it.formula ? ` data-tip="Planned: ${esc(it.formula.replace(/([+\-*/])/g, " $1 "))}"` : "";
        const diffTxt = b.kind === "save"
          ? (d <= 0 ? (d < 0 ? rs0(-d) + " extra" : "Done") : rs0(d) + " to go")
          : (d < 0 ? rs0(-d) + " over" : rs0(d) + " left");
        return `<li>
          <span class="i-name"${tipTxt}>${esc(it.name)}${it.fixed ? ` <span class="tag">Fixed</span>` : ""}</span>
          <span class="i-vals">${rs0(got)} <span class="of">/ ${rs0(pl)}</span></span>
          <span class="i-diff ${d < 0 && b.kind !== "save" ? "neg" : "pos"}">${diffTxt}</span>
          <span class="ibar" aria-hidden="true"><span style="width:${w}%"></span></span>
        </li>`;
      }).join("");
      return `<div class="bucket" style="--c:${bucketColor(b)}">
        <div class="b-top">
          <span class="sw" style="background:${bucketColor(b)}"></span>
          <h3>${esc(b.name)}</h3><span class="b-pct">${esc(b.pct)}%</span>${b.kind === "save" ? ` <span class="tag">Saving</span>` : ""}
          <span class="grow"></span>
          <span class="b-amt">${rs0(actual)} <span class="of">of ${rs0(alloc)}</span></span>
          ${pill}
        </div>
        <div class="bar" role="img" aria-label="${esc(b.name)}: ${rs0(actual)} of ${rs0(alloc)}"><span style="width:${Math.min(100, ratio * 100)}%"></span></div>
        ${noteTxt ? `<p class="b-note">${noteTxt}</p>` : ""}
        <ul class="items">${items}</ul>
      </div>`;
    }).join("");
    const other = st.byBucket.other || 0;
    const otherRow = other > 0 ? `<div class="bucket" style="--c:var(--s-other)">
        <div class="b-top"><span class="sw" style="background:var(--s-other)"></span><h3>Outside plan</h3><span class="grow"></span><span class="b-amt">${rs0(other)}</span><span class="pill neutral">Unbudgeted</span></div>
        <p class="b-note">Spending logged as "Other". Give it a line in the Plan tab if it happens every month.</p>
      </div>` : "";
    const buckets = `<section class="card buckets">
        <div class="card-head"><h2>Where it's going</h2><p class="sub">Each bucket is a share of your ${rs0(st.takeHome)} take-home.</p></div>
        ${bucketRows}${otherRow}
      </section>`;

    // fixed payments
    const fxRows = [];
    fxRows.push(st.salaryLogged
      ? `<li class="done"><span class="chk" aria-hidden="true">✓</span><div class="fx-main"><div class="fx-name">Salary</div><div class="fx-meta">Credit · ${rs0(st.income)} logged</div></div><span class="fx-ok">Received</span></li>`
      : `<li><span class="chk" aria-hidden="true"></span><div class="fx-main"><div class="fx-name">Salary</div><div class="fx-meta">Credit · ${rs0(st.takeHome)} expected</div></div><button type="button" class="btn small" data-log="salary">Log ${rs0(st.takeHome)}</button></li>`);
    let doneCount = st.salaryLogged ? 1 : 0;
    for (const f of st.fixed) {
      const pl = +f.it.planned || 0;
      if (f.due <= 0) {
        doneCount++;
        fxRows.push(`<li class="done"><span class="chk" aria-hidden="true">✓</span><div class="fx-main"><div class="fx-name">${esc(f.it.name)}</div><div class="fx-meta">${esc(f.b.name)} · ${rs0(f.got)} logged</div></div><span class="fx-ok">${f.b.kind === "save" ? "Saved" : "Paid"}</span></li>`);
      } else if (f.got > 0) {
        const p = Math.round((f.got / pl) * 100);
        fxRows.push(`<li class="partial"><span class="chk" aria-hidden="true" style="--p:${p}%"></span><div class="fx-main"><div class="fx-name">${esc(f.it.name)}</div><div class="fx-meta">${rs0(f.got)} of ${rs0(pl)} logged</div></div><button type="button" class="btn small" data-log="${esc(f.it.id)}">Log ${rs0(f.due)}</button></li>`);
      } else {
        fxRows.push(`<li><span class="chk" aria-hidden="true"></span><div class="fx-main"><div class="fx-name">${esc(f.it.name)}</div><div class="fx-meta">${esc(f.b.name)} · ${rs0(pl)}</div></div><button type="button" class="btn small" data-log="${esc(f.it.id)}">Log</button></li>`);
      }
    }
    const fixed = `<section class="card fixed">
        <div class="card-head"><h2>Fixed payments</h2><p class="sub">One tap logs the planned amount, dated ${isCur ? "today" : parseISO(defaultDate()).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}.</p></div>
        <p class="progress-line">${doneCount} of ${st.fixed.length + 1} done for ${esc(mName)}</p>
        <ul class="fx">${fxRows.join("")}</ul>
      </section>`;

    // daily chart
    const perDay = T.variable / daysIn(S.ym);
    const daily = `<section class="card daily">
        <div class="card-head"><h2>Day-to-day spending</h2><p class="sub">Everything except fixed payments and savings. The line is your daily budget of ${rs0(perDay)}.</p></div>
        <div class="chart" id="dailyChart"></div>
      </section>`;

    // goals
    const sums = goalSums();
    const goalRows = (P.goals || []).map((g) => {
      const have = (+g.opening || 0) + (sums[g.id] || 0);
      const target = +g.target || 0;
      const remaining = Math.max(0, target - have);
      const pct = target > 0 ? Math.min(100, (have / target) * 100) : 0;
      const rate = goalRate(g, P);
      const b = P.buckets.find((x) => x.id === g.bucket);
      let pill = "", line;
      if (target > 0 && remaining <= 0) { pill = `<span class="pill good">Reached</span>`; line = "Target reached. Alhamdulillah."; }
      else if (/^\d{4}-\d{2}$/.test(g.by || "")) {
        const n = monthsBetween(cur, g.by) + 1;
        if (n <= 0) { pill = `<span class="pill warn">Date passed</span>`; line = `The target month has passed with ${rs0(remaining)} still to go. Set a new month in Plan.`; }
        else {
          const need = remaining / n;
          pill = rate >= need - 0.5 ? `<span class="pill good">On pace</span>` : `<span class="pill warn">Behind</span>`;
          line = `Needs ${rs0(need)} a month to reach it by ${esc(monthLong(g.by))}. Your plan puts ${rs0(rate)} a month toward it.`;
        }
      } else if (rate > 0) {
        const n = Math.ceil(remaining / rate);
        line = `At ${rs0(rate)} a month${b ? ` from ${esc(b.name)}` : ""}, you reach it in ${n} month${n === 1 ? "" : "s"}, around ${esc(monthLong(shiftYm(cur, n)))}.`;
      } else line = "Pick the bucket that funds this goal in Plan to see when you'll reach it.";
      return `<div class="gitem">
        <div class="g-top"><span class="sw" style="background:${bucketColor(b)}"></span><h3>${esc(g.name)}</h3><span class="grow"></span>${pill}</div>
        <div class="g-num"><strong>${rs0(have)}</strong><span>of ${rs0(target)}</span></div>
        <div class="meter" role="img" aria-label="${Math.round(pct)}% of ${esc(g.name)}"><span style="width:${pct}%"></span></div>
        <p class="g-line">${line}</p>
      </div>`;
    }).join("");
    const goal = `<section class="card goal">
        <div class="card-head"><h2>Saving goals</h2><p class="sub">Entries you log toward a goal fill it up, plus anything saved before you started.</p></div>
        ${goalRows ? `<div class="glist">${goalRows}</div>` : `<div class="empty" style="padding:16px 0"><strong>No goals yet</strong>Add an emergency fund, Umrah or a house deposit in Plan.<br><button type="button" class="btn small" data-goto="plan">Open Plan</button></div>`}
      </section>`;

    // zakat
    const z = P.zakat || {};
    const tracked = (P.goals || []).reduce((a, g) => a + (+g.opening || 0), 0) + savedAllTime();
    const wealth = tracked + (+z.other || 0);
    let zBody;
    if (!(+z.nisab > 0)) {
      zBody = `<p>Savings tracked here: <strong>${rs0(wealth)}</strong>.</p><p>Add today's nisab value in Plan to see whether Zakat is due and roughly how much.</p><p><button type="button" class="btn small" data-goto="plan">Set nisab</button></p>`;
    } else if (wealth >= +z.nisab) {
      zBody = `<div class="g-top"><span class="pill warn">Above nisab</span></div>
        <div class="g-num zk-num"><strong>${rs0(wealth * 0.025)}</strong><span>2.5% of ${rs0(wealth)}</span></div>
        <p>If you have held at least ${rs0(+z.nisab)} for a full lunar year, this is your estimated Zakat.</p>`;
    } else {
      zBody = `<div class="g-top"><span class="pill neutral">Below nisab</span></div>
        <div class="g-num zk-num"><strong>${rs0(wealth)}</strong><span>of ${rs0(+z.nisab)} nisab</span></div>
        <p>Your tracked savings are below nisab, so no Zakat is due on them yet.</p>`;
    }
    const zakat = `<section class="card zakat">
        <div class="card-head"><h2>Zakat estimate</h2><p class="sub">Goal savings, saving-bucket entries and other wealth you add in Plan</p></div>
        ${zBody}
        <p class="fine">An estimate only. Include all cash, gold, silver and investments you own, and confirm the amount with a scholar.</p>
      </section>`;

    el.innerHTML = backupNotice() + `<div class="ov"><div class="col">${hero}${buckets}${daily}</div><div class="col">${fixed}${goal}${zakat}</div></div>`;
    drawDaily(st, perDay);
  }

  // ---------- charts ----------
  function niceTicks(maxV, n = 4) {
    const raw = (maxV || 1) / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / p;
    const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
    const top = Math.max(step, Math.ceil(maxV / step) * step);
    const arr = [];
    for (let v = 0; v <= top + step * 1e-6; v += step) arr.push(v);
    return { top, arr };
  }
  function colPath(x, y, w, h, r = 4) {
    if (h <= 0) return "";
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  }
  const f1 = (n) => Math.round(n * 10) / 10;

  function drawDaily(st, perDay) {
    const box = $("#dailyChart");
    if (!box) return;
    const W = Math.max(280, box.clientWidth || 600);
    const H = 190, m = { l: 54, r: 10, t: 22, b: 24 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const days = st.daily.length;
    const maxV = Math.max(perDay * 1.15, ...st.daily, 1);
    const { top, arr } = niceTicks(maxV);
    const y = (v) => m.t + ih - (v / top) * ih;
    const slot = iw / days;
    const bw = Math.max(3, Math.min(24, slot * 0.62));
    let s = "";
    for (const v of arr) {
      s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(v))}" y2="${f1(y(v))}"/>`;
      s += `<text class="tick" x="${m.l - 8}" y="${f1(y(v) + 3.5)}" text-anchor="end">${esc(compact(v))}</text>`;
    }
    let maxI = -1;
    st.daily.forEach((v, i) => { if (v > 0 && (maxI < 0 || v > st.daily[maxI])) maxI = i; });
    const [yy, mm] = ymParts(S.ym);
    st.daily.forEach((v, i) => {
      const x = m.l + slot * i;
      const label = new Date(yy, mm - 1, i + 1).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" });
      s += `<rect class="hit" x="${f1(x)}" y="${m.t}" width="${f1(slot)}" height="${ih}" data-tip="${esc(label)}: ${esc(rs0(v))}"/>`;
      if (v > 0) {
        const h = Math.max(1.5, (v / top) * ih);
        s += `<path d="${colPath(f1(x + (slot - bw) / 2), f1(m.t + ih - h), f1(bw), f1(h))}" style="fill:var(--accent);pointer-events:none"/>`;
      }
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
    if (perDay > 0) {
      const ry = f1(y(perDay));
      s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${ry}" y2="${ry}" style="pointer-events:none"/>`;
      s += `<text class="tick" x="${W - m.r}" y="${ry - 5}" text-anchor="end" style="fill:var(--ink-2)">${esc(compact(perDay))} a day</text>`;
    }
    if (maxI >= 0) {
      const v = st.daily[maxI];
      const cx = m.l + slot * maxI + slot / 2;
      const ty = Math.max(12, y(v) - 6);
      const anchor = cx < m.l + 30 ? "start" : cx > W - m.r - 30 ? "end" : "middle";
      s += `<text class="lbl" x="${f1(cx)}" y="${f1(ty)}" text-anchor="${anchor}">${esc(compact(v))}</text>`;
    }
    for (let d = 1; d <= days; d++) {
      if (d === 1 || d % 5 === 0) {
        const cx = m.l + slot * (d - 1) + slot / 2;
        s += `<text class="tick" x="${f1(cx)}" y="${H - 6}" text-anchor="middle">${d}</text>`;
      }
    }
    const tot = st.daily.reduce((a, b) => a + b, 0);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Day-to-day spending by day for ${esc(monthLong(S.ym))}, total ${esc(rs0(tot))}">${s}</svg>`;
  }

  function drawStack(box, months) {
    const P = S.data.plan;
    const W = Math.max(300, box.clientWidth || 640);
    const H = 240, m = { l: 56, r: 10, t: 22, b: 26 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const th = +P.takeHome || 0;
    const data = months.map((ym) => {
      const st = stats(ym);
      const segs = P.buckets.map((b) => ({ name: b.name, color: bucketColor(b), v: st.byBucket[b.id] || 0 }));
      if (st.byBucket.other) segs.push({ name: "Outside plan", color: "var(--s-other)", v: st.byBucket.other });
      return { ym, segs, total: segs.reduce((a, x) => a + x.v, 0) };
    });
    const { top, arr } = niceTicks(Math.max(th * 1.05, ...data.map((d) => d.total), 1));
    const y = (v) => m.t + ih - (v / top) * ih;
    const slot = iw / months.length;
    const bw = Math.min(24, slot * 0.55);
    let s = "";
    for (const v of arr) {
      s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${f1(y(v))}" y2="${f1(y(v))}"/>`;
      s += `<text class="tick" x="${m.l - 8}" y="${f1(y(v) + 3.5)}" text-anchor="end">${esc(compact(v))}</text>`;
    }
    data.forEach((d, i) => {
      const x0 = m.l + slot * i;
      const x = x0 + (slot - bw) / 2;
      s += `<rect class="hit" x="${f1(x0)}" y="${m.t}" width="${f1(slot)}" height="${ih}" data-tip="${esc(monthLong(d.ym))}: ${esc(rs0(d.total))} out"/>`;
      const nz = d.segs.filter((g) => g.v > 0);
      let acc = 0;
      nz.forEach((g, k) => {
        const yb = y(acc), yt = y(acc + g.v);
        acc += g.v;
        const gap = k > 0 ? 2 : 0;
        const h = yb - yt - gap;
        if (h <= 0.5) return;
        const tipTxt = `${monthShort(d.ym)} · ${g.name}: ${rs0(g.v)}`;
        if (k === nz.length - 1) s += `<path d="${colPath(f1(x), f1(yt), f1(bw), f1(h))}" style="fill:${g.color}" data-tip="${esc(tipTxt)}"/>`;
        else s += `<rect x="${f1(x)}" y="${f1(yt)}" width="${f1(bw)}" height="${f1(h)}" style="fill:${g.color}" data-tip="${esc(tipTxt)}"/>`;
      });
      s += `<text class="tick" x="${f1(x0 + slot / 2)}" y="${H - 6}" text-anchor="middle">${esc(monthShort(d.ym))}</text>`;
    });
    s += `<line class="base" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
    if (th > 0) {
      const ry = f1(y(th));
      s += `<line class="ref" x1="${m.l}" x2="${W - m.r}" y1="${ry}" y2="${ry}" style="pointer-events:none"/>`;
      s += `<text class="tick" x="${W - m.r}" y="${ry - 5}" text-anchor="end" style="fill:var(--ink-2)">Take-home ${esc(compact(th))}</text>`;
    }
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Money out by bucket, ${esc(monthLong(months[0]))} to ${esc(monthLong(months[months.length - 1]))}">${s}</svg>`;
  }

  // ---------- trends ----------
  function renderTrends() {
    const el = $("#p-trends");
    const P = S.data.plan;
    const months = [];
    for (let k = 5; k >= 0; k--) months.push(shiftYm(S.ym, -k));
    const anyOther = months.some((ym) => stats(ym).byBucket.other);
    const legend = P.buckets.map((b) => `<span><i style="background:${bucketColor(b)}"></i>${esc(b.name)}</span>`).join("")
      + (anyOther ? `<span><i style="background:var(--s-other)"></i>Outside plan</span>` : "")
      + `<span><i class="ref-key"></i>Take-home</span>`;

    const st = stats(S.ym);
    const top = Object.entries(st.byItem).map(([id, v]) => {
      const ref = S.idx.get(id);
      const e = st.es.find((x) => x.item === id && x.type !== "income");
      return { name: ref ? ref.it.name : (e ? labelOf(e) : "Other"), color: ref ? bucketColor(ref.b) : "var(--s-other)", v };
    }).sort((a, b) => b.v - a.v).slice(0, 8);
    const maxTop = top[0]?.v || 1;
    const topHtml = top.length
      ? `<ul class="hbars">${top.map((t) => `<li><span class="hb-name">${esc(t.name)}</span><span class="hb-track"><span style="width:${(t.v / maxTop) * 100}%;background:${t.color}"></span></span><span class="hb-val">${rs0(t.v)}</span></li>`).join("")}</ul>`
      : `<p class="sub">Nothing logged in ${esc(monthOnly(S.ym))} yet.</p>`;

    const rows = months.slice().reverse().map((ym) => {
      const s2 = stats(ym);
      const rate = s2.income > 0 ? Math.round((s2.saved / s2.income) * 100) + "%" : "—";
      return `<tr><td>${esc(monthLong(ym))}</td><td class="num">${rs0(s2.income)}</td><td class="num">${rs0(s2.spent)}</td><td class="num">${rs0(s2.saved)}</td><td class="num">${rate}</td>${P.buckets.map((b) => `<td class="num">${rs0(s2.byBucket[b.id] || 0)}</td>`).join("")}<td class="num">${rs0(s2.byBucket.other || 0)}</td></tr>`;
    }).join("");

    el.innerHTML = `<div class="trends">
      <section class="card">
        <div class="card-head"><h2>Money out by bucket</h2><p class="sub">Last 6 months, spending and savings together</p></div>
        <div class="legend">${legend}</div>
        <div class="chart" id="stackChart"></div>
      </section>
      <section class="card">
        <div class="card-head"><h2>Biggest lines in ${esc(monthOnly(S.ym))}</h2><p class="sub">Coloured by bucket</p></div>
        ${topHtml}
      </section>
      <section class="card wide">
        <div class="card-head"><h2>Month by month</h2><p class="sub">Savings rate is saved &amp; invested divided by income logged.</p></div>
        <div class="tablewrap"><table class="data">

  function findDraftItem(id) {
    for (const b of S.draft.buckets) { const it = (b.items || []).find((x) => x.id === id); if (it) return { it, b }; }
    return null;
  }
  function setText(id, html) { const n = document.getElementById(id); if (n) n.innerHTML = html; }
  function updatePlanCalcs() {
    const D = S.draft;
    const th = +D.takeHome || 0;
    const T = planTotals(D);
    for (const b of D.buckets) {
      const alloc = ((+b.pct || 0) / 100) * th;
      const items = (b.items || []).reduce((a, it) => a + (+it.planned || 0), 0);
      setText(`pl-b-${b.id}-alloc`, rs0(alloc));
      const d = alloc - items;
      setText(`pl-b-${b.id}-check`, Math.abs(d) < 1
        ? `<span class="pill good">Items match</span>`
        : d < 0 ? `<span class="pill bad">Items ${rs0(-d)} over</span>` : `<span class="pill neutral">${rs0(d)} unassigned</span>`);
      for (const it of b.items || []) setText(`pl-i-${it.id}-eq`, it.formula ? `= ${rs(+it.planned || 0)}` : "");
    }
    const pctOk = Math.abs(T.pct - 100) < 0.01;
    const over = T.items - th;
    const checks = [
      pctOk ? `<li><span class="pill good">OK</span><span>Bucket shares add up to 100%.</span></li>`
            : `<li><span class="pill warn">Check</span><span>Bucket shares add up to ${nf.format(T.pct)}%, not 100%.</span></li>`,

        : over > 0 ? `<li><span class="pill bad">Over</span><span>Planned items total ${rs0(T.items)}, ${rs0(over)} more than take-home.</span></li>`
        : `<li><span class="pill neutral">Spare</span><span>Planned items total ${rs0(T.items)}, leaving ${rs0(-over)} unplanned.</span></li>`,
      `<li><span class="pill neutral">Saving</span><span>${rs0(T.save)} a month goes to saving buckets, ${th > 0 ? Math.round((T.save / th) * 100) : 0}% of take-home.</span></li>`,
      `<li><span class="pill neutral">Daily</span><span>Day-to-day items come to ${rs0(T.variable)}, about ${rs0(T.variable / 30)} a day.</span></li>`,

      offerRestore(d, f.lastModified ? new Date(f.lastModified).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "");

          ${row(K("Delete", "red"), "Only when editing an entry. Tap twice to delete.")}
        </dl>
        <div class="grp">Passbook</div>
        <dl class="btnmap">
          ${row("Filter chips", "Show only income, one bucket, or spending outside your plan. The search box finds notes, categories and amounts.")}
          ${row("Any line", "Tap it to edit or delete that entry.")}
          ${row(K("Export CSV"), "Saves every entry as a spreadsheet file.")}
        </dl>
        <div class="grp">Plan</div>
        <dl class="btnmap">
          ${row(K("Fixed"), "Marks an item you pay once a month. It gets a Log button in Fixed payments.")}
          ${row(K("Spending") + K("Saving"), "Saving buckets count as money set aside, not spent, and they fill your goals.")}
          ${row(K("+ Add item") + K("+ Add bucket") + K("+ Add goal"), "Add a line, a whole bucket or a saving goal. The × next to one removes it.")}
          ${row(K("Fit items to buckets"), "After you change your income or percentages, rescales every item to its bucket's new share.")}
          ${row(K("Save plan", "blue") + K("Discard"), "Nothing in Plan changes until you tap Save plan. Discard throws your edits away.")}
        </dl>
        <div class="grp">Settings</div>
        <dl class="btnmap">
          ${row(K("Save backup file", "blue"), "Downloads a copy of all your Hisaab data as a file.")}
          ${row(K("Copy backup code"), "Copies the same backup as text you can paste anywhere.")}
          ${row(K("Restore pasted code"), "Brings your data back from a backup. You confirm before anything is replaced.")}
          ${row(K("Erase everything", "red"), "Deletes all your data from this device. Tap twice. Save a backup first.")}
          ${row(K("Share Hisaab", "blue"), "Opens your phone's share menu, or copies the link, so you can send Hisaab to a friend.")}
        </dl>
      </section>
      <section class="card wide faq">
        <div class="card-head"><h2>Good to know</h2></div>
        <details><summary>Who can see my budget?</summary><p>Only you. Hisaab has no server and no account. Everything is saved in this browser on this device, and nothing you enter is sent anywhere.</p></details>
        <details><summary>Is Hisaab free?</summary><p>Yes. It's free and open source${LINKS.github ? `, and the code is on <a href="${esc(LINKS.github)}" target="_blank" rel="noopener">GitHub</a>` : ""}. There are no ads and no analytics.</p></details>
        <details><summary>Why is Hisaab empty on another phone or browser?</summary><p>Each browser keeps its own copy. Open Hisaab in the same browser every time and bookmark it there. A link opened from inside another app, like Instagram or WhatsApp, can open a different browser, so restore your backup if you see an empty Hisaab.</p></details>
        <details><summary>Why is Free to spend so high at the start of the month?</summary><p>Until you log your salary, Hisaab counts your planned take-home. The number settles once you log what you actually received.</p></details>
        <details><summary>What's the difference between Spending and Saving buckets?</summary><p>Spending buckets (Needs, Self improvement, Health, Family) show money that's gone. Saving buckets (Investments, Emergency fund) show money you've set aside, and they fill your goals.</p></details>
        <details><summary>How is Zakat estimated?</summary><p>Enter today's nisab value in Plan. Hisaab adds your goal savings, saving-bucket entries and any other wealth you enter there, and shows 2.5% when the total is above nisab. Confirm the final amount with a scholar.</p></details>
        <details><summary>Can I switch to the other starting format later?</summary><p>The format only sets your first list of lines. In Plan you can rename, add or remove any line or bucket, so you can reshape it into either format, or your own.</p></details>
        <details><summary>Can I use a currency other than rupees?</summary><p>Yes. Go to Plan, then Income, then Currency, and save the plan.</p></details>
        <details><summary>What happens in a private or incognito window?</summary><p>Nothing is kept after you close it. Use a normal browser window.</p></details>
      </section>
    </div>`;
  }

  // ---------- first-time tour ----------
  const T = { active: false, i: 0 };
  const TOUR = [
    { title: () => `Welcome${firstName(S.data.profile.name) ? ", " + firstName(S.data.profile.name) : ""}`, body: "Here's a one-minute tour of what each part of Hisaab does. You can take it again any time from the Help tab." },
    { tab: "overview", target: ".hero", title: "Free to spend", body: "What's left for this month after spending, savings and fixed payments still due. Until you log your salary, it uses your planned take-home." },
    { tab: "overview", target: ".fixed", title: "Fixed payments", body: "Your monthly must-pays: salary, rent, SIP, parents. Tap <b>Log</b> when one is paid and it's recorded in one tap. Start by logging your salary." },
    { tab: "overview", target: "#fab", title: "Add entry", body: "Log every expense or income here. Pick a category and date. Typing 349+530 adds it up for you." },
    { tab: "overview", target: ".buckets", title: "Where your money goes", body: "Each bucket fills as you spend against its share of your take-home. A red pill means that bucket is over budget." },
    { tab: "overview", target: ".goal", title: "Saving goals", body: "Money you log under Emergency fund or Investments fills these goals, and Hisaab shows when you'll reach each one." },
    { tab: "overview", target: ".zakat", title: "Zakat estimate", body: "Enter today's nisab value in Plan and Hisaab estimates 2.5% of your tracked savings." },
    { tab: "overview", target: ".month-switch", title: "Switch months", body: "Use the arrows to see past months. Tap the month name to come back to this month." },
    { tab: "overview", target: "#t-passbook", title: "Passbook", body: "Every entry for the month, newest first, like a bank passbook. Tap any line to edit or delete it." },
    { tab: "overview", target: "#t-trends", title: "Trends", body: "Your last six months by bucket, your biggest expenses and your savings rate." },
    { tab: "overview", target: "#t-plan", title: "Plan", body: "Change your take-home, bucket percentages, items, goals and nisab. Nothing changes until you tap <b>Save plan</b>." },
    { tab: "profile", target: "#bkSec", title: "Back up every month", body: "Your data lives only on this device. Tap <b>Save backup file</b> here once a month, or <b>Copy backup code</b> if there's no file button. On a new phone, sign up and use Restore just below." },
    { tab: "profile", target: "#t-help", title: "Help", body: "The full guide: what every button does, backup steps, and this tour again." },
    { title: "You're all set", body: "Start by logging your salary in Fixed payments, then add expenses as they happen." },
  ];
  function placeTour() {
    if (!T.active) return;
    const st = TOUR[T.i];
    const root = $("#tour"), hole = $("#tourHole"), card = $("#tourCard");
    const el = st.target ? document.querySelector(st.target) : null;
    const vw = window.innerWidth, vh = window.innerHeight, m = 8;
    const cw = card.offsetWidth, ch = card.offsetHeight;
    if (!el || !el.getClientRects().length) {
      root.classList.add("center"); hole.hidden = true;
      card.style.left = Math.max(16, (vw - cw) / 2) + "px";
      card.style.top = Math.max(16, (vh - ch) / 2) + "px";
      return;
    }
    root.classList.remove("center"); hole.hidden = false;
    const r = el.getBoundingClientRect(), pad = 6;
    const top = Math.max(m, r.top - pad), left = Math.max(m, r.left - pad);
    const bottom = Math.min(vh - m, r.bottom + pad), right = Math.min(vw - m, r.right + pad);
    Object.assign(hole.style, { top: top + "px", left: left + "px", width: Math.max(0, right - left) + "px", height: Math.max(0, bottom - top) + "px" });
    const gap = 12;
    let cy;
    if (vh - bottom >= ch + gap + 16) cy = bottom + gap;
    else if (top >= ch + gap + 16) cy = top - gap - ch;
    else cy = vh - ch - 16;
    const cx = Math.min(Math.max(16, r.left + r.width / 2 - cw / 2), vw - cw - 16);
    card.style.left = cx + "px";
    card.style.top = Math.max(16, cy) + "px";
  }
  function showTourStep(i) {
    T.i = i;
    const st = TOUR[i];
    if (st.tab && S.tab !== st.tab) setTab(st.tab);
    const last = i === TOUR.length - 1;
    const card = $("#tourCard");
    card.innerHTML = `<div class="tour-count">${i + 1} of ${TOUR.length}</div>
      <h3 id="tourTitle">${esc(typeof st.title === "function" ? st.title() : st.title)}</h3>
      <p>${st.body}</p>
      <div class="tour-foot">${last ? "" : `<button type="button" class="btn ghost small" data-tour-skip>Skip tour</button>`}<span class="grow"></span>${i > 0 ? `<button type="button" class="btn small" data-tour-back>Back</button>` : ""}<button type="button" class="btn primary small" data-tour-next>${i === 0 ? "Start" : last ? "Finish" : "Next"}</button></div>`;
    const el = st.target && document.querySelector(st.target);
    if (el && el.closest(".tabs")) el.scrollIntoView({ block: "nearest", inline: "center" });
    else if (el && el.getClientRects().length && getComputedStyle(el).position !== "fixed") {
      const r = el.getBoundingClientRect();
      if (r.top < 60 || r.bottom > window.innerHeight - 40) el.scrollIntoView({ block: r.height > window.innerHeight * 0.55 ? "start" : "center" });
    }
    requestAnimationFrame(() => { placeTour(); const n = card.querySelector("[data-tour-next]"); if (n) n.focus({ preventScroll: true }); });
  }
  function startTour() {
    if (!setupDone()) return;
    if (dlg.open) closeDialog();
    T.active = true;
    $("#tour").hidden = false;
    if (S.tab !== "overview") setTab("overview");
    window.scrollTo(0, 0);
    showTourStep(0);
  }
  function endTour() {
    T.active = false;
    $("#tour").hidden = true;
    if (S.data && !S.data.tourDone) { S.data.tourDone = true; persist(); }
    setTab("overview");
    window.scrollTo(0, 0);
  }
  $("#tour").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.hasAttribute("data-tour-next")) { if (T.i === TOUR.length - 1) endTour(); else showTourStep(T.i + 1); }
    else if (b.hasAttribute("data-tour-back")) showTourStep(Math.max(0, T.i - 1));
    else if (b.hasAttribute("data-tour-skip")) endTour();
  });
  document.addEventListener("keydown", (e) => {
    if (!T.active) return;
    if (e.key === "Escape") { e.preventDefault(); endTour(); }
    else if (e.key === "ArrowRight" && T.i < TOUR.length - 1) showTourStep(T.i + 1);
    else if (e.key === "ArrowLeft" && T.i > 0) showTourStep(T.i - 1);
  });
  let tourRaf = 0;
  const queuePlace = () => { if (!T.active || tourRaf) return; tourRaf = requestAnimationFrame(() => { tourRaf = 0; placeTour(); }); };
  window.addEventListener("resize", queuePlace);
  document.addEventListener("scroll", queuePlace, { passive: true });

  // ---------- sample data ----------
  function seeded(a) {
    return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const DEMO_NOTES = { "Uber": ["Office", "Airport drop", "Late ride home"], "Swiggy/Blinkit": ["Groceries top-up", "Dinner order", "Milk and bread"], "Shopping": ["Clothes", "Home items"], "Dineout": ["Family dinner", "Chai with friends"], "Medicines": ["Pharmacy", "Vitamins"], "Gym/nutrition": ["Protein", "Gym fee"] };
  function buildDemo() {
    const rnd = seeded(7);
    resetOb();
    Object.assign(OB, { format: "ledger", currency: "INR", takeHome: 85000, efOpening: 45000, g2name: "Umrah fund", g2target: 180000, g2opening: 25000 });
    OB.pcts = Object.fromEntries(fmtBuckets().map((d) => [d.id, d.pct]));
    OB.efTarget = roundNice(6 * 85000 * 0.4);
    const plan = buildPlan();
    resetOb();
    const data = { v: 1, demo: true, setupDone: true, createdAt: Date.now(), lastBackupAt: Date.now(), profile: { name: "", joinedAt: Date.now() }, plan, entries: {} };
    const goalFor = (b, it) => (it.nogoal ? "" : (plan.goals.find((g) => g.bucket === b.id) || {}).id || "");
    const cur = thisYm(), today = +todayISO().slice(8, 10);
    let created = Date.now() - 1e9;
    const add = (e) => { const ym = e.date.slice(0, 7); const body = { ...e, createdAt: created++ }; if (!body.goal) delete body.goal; (data.entries[ym] = data.entries[ym] || {})[newId()] = body; };
    for (let k = 5; k >= 0; k--) {
      const ym = shiftYm(cur, -k);
      const last = ym === cur ? today : daysIn(ym);
      const day = (d) => `${ym}-${pad(Math.max(1, Math.min(d, last)))}`;
      add({ type: "income", amount: plan.takeHome, date: day(1), bucket: "income", item: "salary", label: "Salary", note: "" });
      for (const b of plan.buckets) for (const it of b.items) {
        const pl = +it.planned || 0;
        if (!pl) continue;
        if (it.fixed) {
          if (ym === cur && rnd() > 0.6) continue;
          add({ type: "expense", amount: pl, date: day(2 + Math.floor(rnd() * 4)), bucket: b.id, item: it.id, label: it.name, goal: goalFor(b, it), note: "" });
          continue;
        }
        let left = Math.round(pl * (0.7 + rnd() * 0.4) * (ym === cur ? last / daysIn(ym) : 1));
        const n = Math.max(1, Math.round(left / Math.max(300, pl / 6)));
        for (let j = 0; j < n && left > 0; j++) {
          const amt = j === n - 1 ? left : Math.min(left, Math.max(50, Math.round(((left / (n - j)) * (0.6 + rnd() * 0.8)) / 10) * 10));
          left -= amt;
          const notes = DEMO_NOTES[it.name] || [""];
          add({ type: "expense", amount: amt, date: day(1 + Math.floor(rnd() * last)), bucket: b.id, item: it.id, label: it.name, goal: goalFor(b, it), note: notes[Math.floor(rnd() * notes.length)] });
        }
      }
    }
    return normalize(data);
  }
  function startDemo(quiet) {
    if (setupDone() && !S.data.demo) return; // never replace someone's real budget
    S.data = buildDemo();
    S.data.profile.name = "";
    if (quiet) S.data.tourDone = true;
    persist();
    setCurrency("INR");
    reindex();
    S.tab = "overview";
    S.ym = thisYm();
    render();
    window.scrollTo(0, 0);
    if (!quiet) setTimeout(startTour, 300);
  }
  function exitDemo() {
    try { localStorage.removeItem(KEY); } catch (e) {}
    S.data = null; S.dirty = false; S.draft = null;
    resetOb(); reindex();
    S.tab = "overview";
    render();
    window.scrollTo(0, 0);
  }

  // ---------- boot ----------
  S.storageOk = storageWorks();
  S.data = load();
  if (S.data && S.data.profile && !S.data.setupDone) OB.step = 2;
  setCurrency(S.data?.plan?.currency || "INR");
  reindex();
  render();
  $("#appFoot").innerHTML = footer();
  if (setupDone() && !S.data.tourDone) setTimeout(startTour, 500);
  // #demo opens the sample (with the tour); #demo-quiet skips the tour, for screenshots.
  if (!setupDone() && (hashTab === "demo" || hashTab === "demo-quiet")) startDemo(hashTab === "demo-quiet");
  (async () => {
    try {
      const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
      if (dl) {
        S.dl = dl;
        for (const b of document.querySelectorAll("[data-needs-dl]")) b.hidden = false;
        if (setupDone() && S.tab === "passbook") $("#pbExport").hidden = false;
      }
    } catch (e) {}
  })();
})();
</script>
